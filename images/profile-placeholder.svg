<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101c38" />
      <stop offset="100%" stop-color="#0a1224" />
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="10" y="10" width="380" height="430" rx="20" fill="url(#cardBg)" stroke="url(#frameGrad)" stroke-width="2"/>
  
  <!-- Subtle circular ambient aura -->
  <circle cx="200" cy="180" r="130" fill="url(#avatarGlow)"/>

  <!-- Decorative Tech Corner Accents -->
  <path d="M 25 50 L 25 25 L 50 25" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 375 50 L 375 25 L 350 25" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 25 390 L 25 415 L 50 415" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 375 390 L 375 415 L 350 415" fill="none" stroke="#00d2ff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Circular Avatar Outline -->
  <circle cx="200" cy="175" r="95" fill="#132040" stroke="url(#frameGrad)" stroke-width="3" filter="url(#softGlow)"/>
  
  <!-- Stylized Developer Silhouette & Database Emblem -->
  <g transform="translate(135, 110)">
    <!-- Database Stack & User Icon -->
    <path d="M 65 30 C 50 30 38 42 38 57 C 38 72 50 84 65 84 C 80 84 92 72 92 57 C 92 42 80 30 65 30 Z" fill="#38bdf8" opacity="0.9"/>
    <!-- Shoulders -->
    <path d="M 25 125 C 25 98 43 92 65 92 C 87 92 105 98 105 125 Z" fill="#8b5cf6" opacity="0.85"/>
  </g>

  <!-- Badge in Avatar Corner -->
  <g transform="translate(250, 220)">
    <circle cx="18" cy="18" r="18" fill="#0f172a" stroke="#00d2ff" stroke-width="2"/>
    <!-- Terminal / DB Icon -->
    <path d="M 11 14 L 16 18 L 11 22" fill="none" stroke="#00d2ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="18" y1="22" x2="25" y2="22" stroke="#00d2ff" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Name & Title on Card -->
  <text x="200" y="315" text-anchor="middle" fill="#f8fafc" font-family="'Poppins', sans-serif" font-size="16" font-weight="700">Bedir Abdelhamid Alzomor</text>
  <text x="200" y="338" text-anchor="middle" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">DATA ENGINEER</text>
  <text x="200" y="358" text-anchor="middle" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="11">Database Design &amp; SQL Specialist</text>

  <!-- Instructional Drop-in Box for real photo -->
  <g transform="translate(45, 380)">
    <rect width="310" height="38" rx="8" fill="#17264a" stroke="#334155" stroke-dasharray="4,4"/>
    <text x="155" y="23" text-anchor="middle" fill="#a78bfa" font-family="'Poppins', sans-serif" font-size="10.5">
      📷 Professional Photo Placeholder
    </text>
  </g>
</svg>
