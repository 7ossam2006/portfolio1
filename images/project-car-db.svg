<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="carDbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101e" />
      <stop offset="50%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#0b1324" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <pattern id="carGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#carDbBg)" rx="12"/>
  <rect width="800" height="500" fill="url(#carGrid)" rx="12"/>

  <!-- Subtle Automotive Contour Silhouette Background watermark -->
  <path d="M 120 420 C 180 420 220 370 290 370 C 370 370 410 320 530 320 C 640 320 690 380 730 400 C 760 415 780 420 780 420" 
        fill="none" stroke="#00d2ff" stroke-width="1.5" stroke-opacity="0.12" stroke-dasharray="6,4"/>
  <circle cx="250" cy="420" r="32" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.1"/>
  <circle cx="660" cy="420" r="32" fill="none" stroke="#00d2ff" stroke-width="1.2" stroke-opacity="0.1"/>

  <!-- Top Title Bar -->
  <rect x="25" y="20" width="750" height="38" rx="8" fill="#101c38" stroke="#1e2f5b" stroke-width="1"/>
  <text x="45" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold">SQL SERVER</text>
  <text x="145" y="44" fill="#94a3b8" font-family="'Poppins', sans-serif" font-size="12">| Car Import &amp; Dealership Relational Schema Architecture (3NF)</text>
  <rect x="670" y="28" width="90" height="22" rx="4" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="0.8"/>
  <text x="684" y="43" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="600">NORMALIZED</text>

  <!-- Table 1: Suppliers / Manufacturers (Top Left) -->
  <g transform="translate(35, 75)">
    <rect width="215" height="150" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
    <rect width="215" height="28" rx="6" fill="#0284c7" fill-opacity="0.25"/>
    <text x="12" y="19" fill="#f8fafc" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">TABLE: Suppliers</text>
    <text x="12" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">PK  supplier_id</text>
    <text x="145" y="48" fill="#64748b" font-family="monospace" font-size="9.5">INT</text>
    <text x="12" y="70" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    company_name</text>
    <text x="145" y="70" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(100)</text>
    <text x="12" y="92" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    origin_country</text>
    <text x="145" y="92" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(50)</text>
    <text x="12" y="114" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    import_license</text>
    <text x="145" y="114" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(30)</text>
    <text x="12" y="136" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    contact_phone</text>
    <text x="145" y="136" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(20)</text>
  </g>

  <!-- Table 2: Vehicles / Inventory (Top Center) -->
  <g transform="translate(290, 75)">
    <rect width="230" height="175" rx="6" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5"/>
    <rect width="230" height="28" rx="6" fill="#00d2ff" fill-opacity="0.25"/>
    <text x="12" y="19" fill="#f8fafc" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">TABLE: Vehicles (Inventory)</text>
    <text x="12" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">PK  vin_number</text>
    <text x="160" y="48" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(17)</text>
    <text x="12" y="70" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">FK  supplier_id</text>
    <text x="160" y="70" fill="#64748b" font-family="monospace" font-size="9.5">INT</text>
    <text x="12" y="92" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    make_model</text>
    <text x="160" y="92" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(80)</text>
    <text x="12" y="114" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    model_year</text>
    <text x="160" y="114" fill="#64748b" font-family="monospace" font-size="9.5">SMALLINT</text>
    <text x="12" y="136" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    import_cost</text>
    <text x="160" y="136" fill="#64748b" font-family="monospace" font-size="9.5">DECIMAL(10,2)</text>
    <text x="12" y="158" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">    status (InStock/Sold)</text>
    <text x="160" y="158" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(15)</text>
  </g>

  <!-- Relationship Line: Suppliers -> Vehicles -->
  <path d="M 250 120 L 290 120" stroke="#00d2ff" stroke-width="1.8"/>
  <circle cx="250" cy="120" r="3" fill="#00d2ff"/>
  <polygon points="284,116 284,124 290,120" fill="#00d2ff"/>

  <!-- Table 3: Customers (Top Right) -->
  <g transform="translate(560, 75)">
    <rect width="205" height="150" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect width="205" height="28" rx="6" fill="#8b5cf6" fill-opacity="0.25"/>
    <text x="12" y="19" fill="#f8fafc" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">TABLE: Customers</text>
    <text x="12" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">PK  customer_id</text>
    <text x="145" y="48" fill="#64748b" font-family="monospace" font-size="9.5">INT</text>
    <text x="12" y="70" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    national_id</text>
    <text x="145" y="70" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(20)</text>
    <text x="12" y="92" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    client_name</text>
    <text x="145" y="92" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(100)</text>
    <text x="12" y="114" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    phone_number</text>
    <text x="145" y="114" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(20)</text>
    <text x="12" y="136" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    city</text>
    <text x="145" y="136" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(50)</text>
  </g>

  <!-- Table 4: Sales Transactions (Bottom Center) -->
  <g transform="translate(290, 280)">
    <rect width="230" height="155" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.3"/>
    <rect width="230" height="28" rx="6" fill="#10b981" fill-opacity="0.25"/>
    <text x="12" y="19" fill="#f8fafc" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">TABLE: Sales_Transactions</text>
    <text x="12" y="48" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">PK  sale_id</text>
    <text x="160" y="48" fill="#64748b" font-family="monospace" font-size="9.5">INT</text>
    <text x="12" y="70" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">FK  vin_number</text>
    <text x="160" y="70" fill="#64748b" font-family="monospace" font-size="9.5">VARCHAR(17)</text>
    <text x="12" y="92" fill="#a78bfa" font-family="'JetBrains Mono', monospace" font-size="10">FK  customer_id</text>
    <text x="160" y="92" fill="#64748b" font-family="monospace" font-size="9.5">INT</text>
    <text x="12" y="114" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="10">    sale_date</text>
    <text x="160" y="114" fill="#64748b" font-family="monospace" font-size="9.5">DATE</text>
    <text x="12" y="136" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="10">    final_sale_price</text>
    <text x="160" y="136" fill="#64748b" font-family="monospace" font-size="9.5">DECIMAL(10,2)</text>
  </g>

  <!-- Connectors to Sales_Transactions -->
  <path d="M 405 250 L 405 280" stroke="#00d2ff" stroke-width="1.8"/>
  <circle cx="405" cy="250" r="3" fill="#00d2ff"/>
  <polygon points="401,274 409,274 405,280" fill="#00d2ff"/>

  <path d="M 662 225 L 662 340 L 520 340" stroke="#8b5cf6" stroke-width="1.8" fill="none"/>
  <circle cx="662" cy="225" r="3" fill="#8b5cf6"/>
  <polygon points="526,336 526,344 520,340" fill="#8b5cf6"/>

  <!-- SQL Query Example Box (Bottom Left) -->
  <g transform="translate(35, 245)">
    <rect width="235" height="210" rx="6" fill="#081020" stroke="#1e293b"/>
    <rect width="235" height="24" rx="6" fill="#111c33"/>
    <text x="10" y="16" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10">SQL: Analytical Query</text>
    
    <text x="10" y="44" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9.5">SELECT</text>
    <text x="10" y="60" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">  v.make_model,</text>
    <text x="10" y="76" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">  COUNT(s.sale_id) AS total,</text>
    <text x="10" y="92" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">  AVG(s.final_sale_price)</text>
    <text x="10" y="108" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9.5">FROM</text>
    <text x="45" y="108" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">Vehicles v</text>
    <text x="10" y="124" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9.5">JOIN</text>
    <text x="45" y="124" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">Sales_Transactions s</text>
    <text x="10" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">  ON v.vin_number = s.vin</text>
    <text x="10" y="156" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9.5">GROUP BY</text>
    <text x="70" y="156" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">v.make_model</text>
    <text x="10" y="172" fill="#ec4899" font-family="'JetBrains Mono', monospace" font-size="9.5">HAVING</text>
    <text x="60" y="172" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="9">COUNT(s.sale_id) &gt; 1</text>
    <text x="10" y="194" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9.5">-- Optimized Query ✓</text>
  </g>

  <!-- Technical Highlights (Bottom Right) -->
  <g transform="translate(545, 275)">
    <rect width="220" height="180" rx="6" fill="#0d182e" stroke="#1e293b"/>
    <text x="12" y="24" fill="#38bdf8" font-family="'Poppins', sans-serif" font-size="11" font-weight="600">DATABASE DESIGN ATTRIBUTES:</text>
    
    <text x="12" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">• 3NF Relational Normalization</text>
    <text x="12" y="72" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">• Structured Foreign Key Integrity</text>
    <text x="12" y="94" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">• Efficient Indexing on VIN &amp; IDs</text>
    <text x="12" y="116" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">• Stored Procedures &amp; Views</text>
    <text x="12" y="138" fill="#e2e8f0" font-family="sans-serif" font-size="10.5">• Clean Raw-to-Relational ETL Prep</text>
    
    <rect x="12" y="148" width="195" height="22" rx="4" fill="#00d2ff" fill-opacity="0.12"/>
    <text x="18" y="163" fill="#00d2ff" font-family="'JetBrains Mono', monospace" font-size="9.5">MS SQL Server &amp; SSMS</text>
  </g>
</svg>
